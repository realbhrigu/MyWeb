<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bhrigu Das | Launching Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #07090e;
      --glass-surface: rgba(255, 255, 255, 0.05);
      --glass-card: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.14);
      --glass-highlight: rgba(255, 255, 255, 0.35);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.35);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    /* Ambient Lighting */
    .mesh-glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      z-index: 0;
      pointer-events: none;
    }

    .mesh-1 {
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, #2563eb 0%, rgba(37, 99, 235, 0) 70%);
      top: -50px;
      left: 10%;
    }

    .mesh-2 {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, #7c3aed 0%, rgba(124, 58, 237, 0) 70%);
      bottom: -50px;
      right: 10%;
    }

    /* Countdown Glass Container */
    .glass-box {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 680px;
      background: var(--glass-surface);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      box-shadow: 
        0 25px 60px rgba(0, 0, 0, 0.6),
        inset 0 1px 1px var(--glass-highlight);
      padding: 48px 32px;
      text-align: center;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--accent);
      padding: 6px 16px;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    h1 {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #ffffff 40%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 36px;
      line-height: 1.5;
    }

    /* Timer Grid */
    .timer-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 36px;
    }

    .timer-unit {
      background: var(--glass-card);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      padding: 18px 8px;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
    }

    .number {
      font-family: 'JetBrains Mono', monospace;
      font-size: 2.2rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.1;
      text-shadow: 0 0 20px var(--accent-glow);
    }

    .label {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .footer-text {
      color: #64748b;
      font-size: 0.82rem;
      letter-spacing: 0.04em;
    }

    @media (max-width: 550px) {
      .glass-box {
        padding: 32px 18px;
      }
      h1 {
        font-size: 1.85rem;
      }
      .timer-grid {
        gap: 8px;
      }
      .number {
        font-size: 1.6rem;
      }
      .label {
        font-size: 0.65rem;
      }
    }
  </style>
</head>
<body>

  <div class="mesh-glow mesh-1"></div>
  <div class="mesh-glow mesh-2"></div>

  <main class="glass-box">
    
    <div class="status-badge">
      <span class="pulse-dot"></span> BHRIGU 
    </div>

    <h1>COMING SOON</h1>
    <p class="subtitle">PROJECT GAAV UNDER DEVELOPMENT</p>

    <div class="timer-grid" id="countdown">
      <div class="timer-unit">
        <div class="number" id="days">00</div>
        <div class="label">Days</div>
      </div>
      <div class="timer-unit">
        <div class="number" id="hours">00</div>
        <div class="label">Hours</div>
      </div>
      <div class="timer-unit">
        <div class="number" id="minutes">00</div>
        <div class="label">Minutes</div>
      </div>
      <div class="timer-unit">
        <div class="number" id="seconds">00</div>
        <div class="label">Seconds</div>
      </div>
    </div>

    <div class="footer-text">
      Target Launch: <strong>16 October2026</strong>
    </div>

  </main>

  <script>
    // Target: 16 October 2026 00:00:00
    const targetDate = new Date('October 16 , 2026 00:00:00').getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const difference = targetDate - now;

      if (difference <= 0) {
        document.getElementById('days').textContent = '00';
        document.getElementById('hours').textContent = '00';
        document.getElementById('minutes').textContent = '00';
        document.getElementById('seconds').textContent = '00';
        document.querySelector('.status-badge').innerHTML = '<span class="pulse-dot"></span> Ready for Deployment';
        return;
      }

      const days = Math.floor(difference / (1000 * 60 * 60 * 24));
      const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((difference % (1000 * 60)) / 1000);

      document.getElementById('days').textContent = String(days).padStart(2, '0');
      document.getElementById('hours').textContent = String(hours).padStart(2, '0');
      document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
      document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>

</body>
</html>
