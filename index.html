<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anime Welcome Animation Loop</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(135deg, #1a1c29, #382c56, #5c437a);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .welcome-scene {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: inset 0 0 120px rgba(0, 0, 0, 0.6);
        }

        /* Glowing Welcome Orb Background */
        .welcome-orb {
            position: absolute;
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, rgba(255,182,193,0.4) 0%, rgba(138,43,226,0.15) 70%, transparent 100%);
            border-radius: 50%;
            animation: orbPulse 4s ease-in-out infinite alternate;
            z-index: 1;
        }

        /* Central Glassmorphism Card for Welcome Message */
        .welcome-card {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 30px 40px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3), 0 0 20px rgba(255, 182, 193, 0.2);
            animation: cardFloat 3s ease-in-out infinite alternate;
            max-width: 85%;
        }

        /* Main Welcome Heading */
        .welcome-title {
            color: #ffffff;
            font-size: 8vw;
            font-weight: 800;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin: 0;
            background: linear-gradient(to right, #ffb7c5, #ffdfba, #b4d2e7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 183, 197, 0.5);
            animation: textGlow 3s ease-in-out infinite alternate;
        }

        /* Subtitle / Greeting Message */
        .welcome-subtitle {
            color: #e2d9f3;
            font-size: 3.5vw;
            letter-spacing: 3px;
            margin-top: 12px;
            text-transform: uppercase;
            opacity: 0.9;
        }

        /* Floating Sparkles / Stars */
        .sparkle {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            animation: sparkleFloat 3s linear infinite;
            opacity: 0.7;
            z-index: 2;
        }

        .sparkle:nth-child(1) { left: 20%; top: 25%; width: 4px; height: 4px; animation-delay: 0s; }
        .sparkle:nth-child(2) { left: 80%; top: 20%; width: 3px; height: 3px; animation-delay: 1s; }
        .sparkle:nth-child(3) { left: 15%; top: 75%; width: 3px; height: 3px; animation-delay: 2s; }
        .sparkle:nth-child(4) { left: 85%; top: 70%; width: 5px; height: 5px; animation-delay: 1.5s; }
        .sparkle:nth-child(5) { left: 50%; top: 15%; width: 2px; height: 2px; animation-delay: 0.5s; }

        /* Media Queries for Desktop / Larger Screens */
        @media (min-width: 768px) {
            .welcome-card { padding: 40px 60px; }
            .welcome-title { font-size: 3.5rem; letter-spacing: 6px; }
            .welcome-subtitle { font-size: 1.1rem; letter-spacing: 4px; }
            .welcome-orb { width: 450px; height: 450px; }
        }

        /* Keyframes Animations */
        @keyframes orbPulse {
            0% { transform: scale(0.9); opacity: 0.6; }
            100% { transform: scale(1.15); opacity: 1; }
        }

        @keyframes cardFloat {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-12px); }
        }

        @keyframes textGlow {
            0% { filter: drop-shadow(0 0 5px rgba(255, 183, 197, 0.4)); }
            100% { filter: drop-shadow(0 0 15px rgba(255, 183, 197, 0.9)); }
        }

        @keyframes sparkleFloat {
            0% { transform: translateY(0) translateX(0) scale(0.8); opacity: 0; }
            50% { opacity: 1; transform: scale(1.2); }
            100% { transform: translateY(-40px) translateX(20px) scale(0.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="welcome-scene">
        <!-- Glowing Background Orb -->
        <div class="welcome-orb"></div>

        <!-- Floating Magic Sparkles -->
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>

        <!-- Central Welcome Card -->
        <div class="welcome-card">
            <h1 class="welcome-title">Welcome</h1>
            <div class="welcome-subtitle">~ Glad to have you here ~</div>
        </div>
    </div>

</body>
</html>
